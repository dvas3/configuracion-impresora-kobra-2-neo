# Macros for Anycubic Kobra 2 Neo running Klipper.
# Hardware limits, offsets, PID, pins and kinematics live in printer.cfg.

[gcode_macro _SET_STATUS_READY]
gcode:
  M117 Lista

[gcode_macro _SET_STATUS_HEATING]
gcode:
  M117 Calentando

[gcode_macro _SET_STATUS_MESH]
gcode:
  M117 Midiendo cama

[gcode_macro _SET_STATUS_PRINTING]
gcode:
  M117 Imprimiendo

[gcode_macro _SET_STATUS_PAUSED]
gcode:
  M117 Impresion en pausa

[gcode_macro _SET_STATUS_CANCELLED]
gcode:
  M117 Impresion cancelada

[gcode_macro _SAFE_EXTRUDE]
description: Extrude only when the active extruder is hot enough
gcode:
  {% set length = params.LENGTH|default(0)|float %}
  {% set speed = params.SPEED|default(25)|float %}
  {% set extruder = printer.toolhead.extruder %}
  {% if extruder != "" and printer[extruder].can_extrude %}
    SAVE_GCODE_STATE NAME=STATE_SAFE_EXTRUDE
    M83
    G1 E{length} F{speed * 60}
    RESTORE_GCODE_STATE NAME=STATE_SAFE_EXTRUDE MOVE=0
  {% elif length|abs > 0 %}
    RESPOND TYPE=echo MSG="Extruder not hot enough; extrusion skipped"
  {% endif %}

[gcode_macro _SAFE_RETRACT]
description: Retract only when the active extruder is hot enough
gcode:
  {% set length = params.LENGTH|default(1.2)|abs %}
  {% set speed = params.SPEED|default(35)|float %}
  _SAFE_EXTRUDE LENGTH=-{length} SPEED={speed}

[gcode_macro _PARK_HEAD]
description: Park the toolhead within configured axis limits
gcode:
  {% set axis_min = printer.toolhead.axis_minimum %}
  {% set axis_max = printer.toolhead.axis_maximum %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set z_hop = params.Z|default(10)|float %}
  {% set x_req = params.X|default(220)|float %}
  {% set y_req = params.Y|default(220)|float %}
  {% set z_target = [[pos.z + z_hop, axis_min.z + 1]|max, axis_max.z - 1]|min %}
  {% set x_target = [[x_req, axis_min.x + 1]|max, axis_max.x - 1]|min %}
  {% set y_target = [[y_req, axis_min.y + 1]|max, axis_max.y - 1]|min %}
  {% set move_speed = params.MOVE_SPEED|default(150)|float %}
  {% set z_speed = params.Z_SPEED|default(15)|float %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    SAVE_GCODE_STATE NAME=STATE_PARK_HEAD
    G90
    G1 Z{z_target} F{z_speed * 60}
    G1 X{x_target} Y{y_target} F{move_speed * 60}
    RESTORE_GCODE_STATE NAME=STATE_PARK_HEAD MOVE=0
  {% else %}
    RESPOND TYPE=echo MSG="Printer not homed; park skipped"
  {% endif %}

[gcode_macro _CENTER_IF_HOMED]
description: Move near bed center when homed
gcode:
  {% set x = params.X|default(110)|float %}
  {% set y = params.Y|default(110)|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 X{x} Y{y} Z10 F9000

[gcode_macro _BED_MESH_START]
description: Load, calibrate, or clear bed mesh for START_PRINT
gcode:
  {% set mode = params.MODE|default("load")|lower %}
  {% set profile = params.PROFILE|default("ultra")|string %}
  {% set fallback = params.FALLBACK|default("error")|lower %}
  {% set profiles = printer.bed_mesh.profiles|default({}) %}
  {% if mode in ["none", "off", "0", "false"] %}
    BED_MESH_CLEAR
    RESPOND TYPE=echo MSG="Bed mesh disabled for this print"
  {% elif mode in ["calibrate", "mesh", "1", "true"] %}
    _SET_STATUS_MESH
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE={profile}
  {% elif mode == "load" %}
    BED_MESH_CLEAR
    {% if profile in profiles %}
      BED_MESH_PROFILE LOAD={profile}
      RESPOND TYPE=echo MSG='{"Loaded bed mesh profile \"%s\"" % profile}'
    {% elif fallback == "calibrate" %}
      RESPOND TYPE=echo MSG='{"Bed mesh profile \"%s\" not found; calibrating temporary mesh" % profile}'
      _SET_STATUS_MESH
      BED_MESH_CALIBRATE PROFILE={profile}
    {% else %}
      { action_raise_error("Bed mesh profile '%s' not found. Run MESH_PRECISE and SAVE_CONFIG, or use MESH=calibrate." % profile) }
    {% endif %}
  {% else %}
    { action_raise_error("Unsupported MESH mode '%s'. Use load, calibrate, or none." % mode) }
  {% endif %}

[gcode_macro PURGE_LINE]
description: Prime the nozzle with a compact front-edge purge line
gcode:
  {% set axis_min = printer.toolhead.axis_minimum %}
  {% set axis_max = printer.toolhead.axis_maximum %}
  {% set print_min_x = [[params.PRINT_MIN_X|default(0)|float, axis_min.x + 1]|max, axis_max.x - 2]|min %}
  {% set print_min_y = [[params.PRINT_MIN_Y|default(0)|float, axis_min.y + 1]|max, axis_max.y - 2]|min %}
  {% set print_max_x = [[params.PRINT_MAX_X|default(220)|float, print_min_x + 2]|max, axis_max.x - 2]|min %}
  {% set print_max_y = [[params.PRINT_MAX_Y|default(220)|float, print_min_y + 20]|max, axis_max.y - 2]|min %}
  {% set miny = params.MINY|default(999)|float %}
  {% set maxy = params.MAXY|default(-999)|float %}
  {% set length = [params.LENGTH|default(70)|float, print_max_y - print_min_y - 10]|min %}
  {% set e1 = params.E1|default(7.0)|float %}
  {% set e2 = params.E2|default(4.0)|float %}
  {% set x = [[params.X|default(5)|float, print_min_x + 1]|max, print_max_x - 2]|min %}
  {% set front_y = [[params.Y|default(8)|float, print_min_y + 1]|max, print_max_y - length - 5]|min %}
  {% set back_y = [[print_max_y - length - 8, print_min_y + 1]|max, print_max_y - length - 5]|min %}
  {% set use_back = miny <= front_y + length + 5 and maxy < back_y - 5 %}
  {% set y_start = back_y if use_back else front_y %}
  {% set y_end = [y_start + length, print_max_y - 2]|min %}
  {% set z = params.Z|default(0.30)|float %}
  G90
  M83
  G92 E0
  G1 Z5 F2400
  G1 X{x} Y{y_start} F9000
  G1 Z{z} F900
  G1 X{x} Y{y_end} E{e1} F900
  G1 X{x + 0.8} Y{y_end} F9000
  G1 X{x + 0.8} Y{y_start} E{e2} F900
  G92 E0
  G1 Z1.2 F2400

[gcode_macro START_PRINT]
description: Heat, home, prepare mesh and purge before printing
gcode:
  {% set bed_temp = params.BED_TEMP|default(params.BED_TEMPERATURE|default(params.BED|default(60)))|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(params.NOZZLE_TEMP|default(params.NOZZLE_TEMPERATURE|default(params.EXTRUDER|default(205))))|float %}
  {% set standby_temp = [params.STANDBY_TEMP|default(150)|float, extruder_temp]|min %}
  {% set mesh_mode = params.MESH|default("load")|string %}
  {% set mesh_profile = params.MESH_PROFILE|default("ultra")|string %}
  {% set mesh_fallback = params.MESH_FALLBACK|default("error")|string %}
  {% set soak = params.SOAK|default(0)|int %}
  {% set axis_min = printer.toolhead.axis_minimum %}
  {% set axis_max = printer.toolhead.axis_maximum %}
  {% set print_min_x = [[params.PRINT_MIN_X|default(0)|float, axis_min.x + 1]|max, axis_max.x - 2]|min %}
  {% set print_min_y = [[params.PRINT_MIN_Y|default(0)|float, axis_min.y + 1]|max, axis_max.y - 2]|min %}
  {% set print_max_x = [[params.PRINT_MAX_X|default(220)|float, print_min_x + 2]|max, axis_max.x - 2]|min %}
  {% set print_max_y = [[params.PRINT_MAX_Y|default(220)|float, print_min_y + 2]|max, axis_max.y - 2]|min %}
  {% set minx = params.MINX|default(0)|float %}
  {% set miny = params.MINY|default(999)|float %}
  {% set maxx = params.MAXX|default(0)|float %}
  {% set maxy = params.MAXY|default(-999)|float %}
  {% set start_x_raw = params.START_X|default(minx if minx > 0 else 20)|float %}
  {% set start_y_raw = params.START_Y|default(miny if miny < 999 else 20)|float %}
  {% set start_x = [[start_x_raw, print_min_x + 1]|max, print_max_x - 1]|min %}
  {% set start_y = [[start_y_raw, print_min_y + 1]|max, print_max_y - 1]|min %}

  _SET_STATUS_HEATING
  CLEAR_PAUSE
  M220 S100
  M221 S100
  G90
  M83
  M106 S0
  M140 S{bed_temp}
  M104 S{standby_temp}
  M190 S{bed_temp}
  {% if soak > 0 %}
    G4 P{soak * 1000}
  {% endif %}
  G28
  _BED_MESH_START MODE={mesh_mode} PROFILE={mesh_profile} FALLBACK={mesh_fallback}
  M104 S{extruder_temp}
  M109 S{extruder_temp}
  PURGE_LINE MINY={miny} MAXY={maxy} PRINT_MIN_X={print_min_x} PRINT_MIN_Y={print_min_y} PRINT_MAX_X={print_max_x} PRINT_MAX_Y={print_max_y}
  G1 X{start_x} Y{start_y} Z2.0 F9000
  _SET_STATUS_PRINTING
  {% if params.CHAMBER_TEMP is defined and params.CHAMBER_TEMP|float > 0 %}
    RESPOND TYPE=echo MSG="CHAMBER_TEMP ignored: no chamber heater configured"
  {% endif %}

[gcode_macro START_PRINT_MESH]
description: Start print and run a fresh bed mesh
gcode:
  START_PRINT {rawparams} MESH=calibrate

[gcode_macro START_PRINT_NO_MESH]
description: Start print without bed mesh compensation
gcode:
  START_PRINT {rawparams} MESH=none

[gcode_macro PRINT_START]
description: Alias for slicers that call PRINT_START
gcode:
  START_PRINT {rawparams}

[gcode_macro END_PRINT]
description: Finish print safely and park the toolhead
gcode:
  {% set z_lift = params.Z|default(10)|float %}
  {% set disable_motors = params.DISABLE_MOTORS|default(0)|int != 0 %}
  SAVE_GCODE_STATE NAME=STATE_END_PRINT
  M400
  _SAFE_RETRACT LENGTH={params.RETRACT|default(2.0)} SPEED={params.RETRACT_SPEED|default(35)}
  _PARK_HEAD Z={z_lift}
  TURN_OFF_HEATERS
  M106 S0
  BED_MESH_CLEAR
  _SET_STATUS_READY
  {% if disable_motors %}
    M84
  {% endif %}
  RESTORE_GCODE_STATE NAME=STATE_END_PRINT MOVE=0

[gcode_macro PRINT_END]
description: Alias for slicers that call PRINT_END
gcode:
  END_PRINT {rawparams}

[gcode_macro CANCEL_PRINT]
description: Cancel the current print and leave the printer safe
rename_existing: CANCEL_PRINT_BASE
gcode:
  SAVE_GCODE_STATE NAME=STATE_CANCEL_PRINT
  M400
  _SAFE_RETRACT LENGTH={params.RETRACT|default(5.0)} SPEED={params.RETRACT_SPEED|default(35)}
  _PARK_HEAD Z={params.Z|default(10)}
  TURN_OFF_HEATERS
  M106 S0
  BED_MESH_CLEAR
  CLEAR_PAUSE
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  _SET_STATUS_CANCELLED
  RESTORE_GCODE_STATE NAME=STATE_CANCEL_PRINT MOVE=0
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause print, save state, retract and park
rename_existing: PAUSE_BASE
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% set target = printer[extruder].target if extruder != "" else 0 %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_extruder_temp VALUE={target}
  SAVE_GCODE_STATE NAME=STATE_PAUSE_PRINT
  PAUSE_BASE
  _SAFE_RETRACT LENGTH={params.RETRACT|default(1.2)} SPEED={params.RETRACT_SPEED|default(35)}
  _PARK_HEAD X={params.X|default(220)} Y={params.Y|default(220)} Z={params.Z|default(10)}
  _SET_STATUS_PAUSED

[gcode_macro RESUME]
description: Restore parser state and resume a paused print
rename_existing: RESUME_BASE
variable_restore_extruder_temp: 0
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% set velocity = params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity)|float %}
  {% if extruder != "" and restore_extruder_temp|float > 0 %}
    M109 S{restore_extruder_temp}
  {% endif %}
  _SAFE_EXTRUDE LENGTH={params.UNRETRACT|default(1.2)} SPEED={params.UNRETRACT_SPEED|default(25)}
  RESTORE_GCODE_STATE NAME=STATE_PAUSE_PRINT MOVE=0
  _SET_STATUS_PRINTING
  RESUME_BASE VELOCITY={velocity}

[gcode_macro LOAD_FILAMENT]
description: Heat and load filament through the extruder
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% set fast = params.FAST|default(70)|float %}
  {% set slow = params.SLOW|default(20)|float %}
  {% set old_target = printer.extruder.target|float %}
  SAVE_GCODE_STATE NAME=STATE_LOAD_FILAMENT
  _CENTER_IF_HOMED
  M109 S{temp}
  M83
  G92 E0
  G1 E{fast} F600
  G1 E{slow} F180
  G92 E0
  {% if params.COOLDOWN|default(0)|int != 0 %}
    M104 S0
  {% else %}
    M104 S{old_target}
  {% endif %}
  RESTORE_GCODE_STATE NAME=STATE_LOAD_FILAMENT MOVE=0

[gcode_macro UNLOAD_FILAMENT]
description: Heat and unload filament from the extruder
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% set purge = params.PURGE|default(8)|float %}
  {% set tip = params.TIP|default(20)|float %}
  {% set unload = params.UNLOAD|default(85)|float %}
  {% set old_target = printer.extruder.target|float %}
  SAVE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT
  _CENTER_IF_HOMED
  M109 S{temp}
  M83
  G92 E0
  G1 E{purge} F300
  G1 E-{tip} F1200
  G1 E-{unload} F2400
  G92 E0
  {% if params.COOLDOWN|default(0)|int != 0 %}
    M104 S0
  {% else %}
    M104 S{old_target}
  {% endif %}
  RESTORE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT MOVE=0

[gcode_macro M600]
description: Filament change pause
gcode:
  PAUSE X=10 Y=220 Z=20

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause at the next layer reported by SET_PRINT_STATS_INFO
gcode:
  {% set pause_next_layer = printer["gcode_macro SET_PRINT_STATS_INFO"].pause_next_layer %}
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  {% set macro = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': enable, 'call': macro }}"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause at a specific layer reported by SET_PRINT_STATS_INFO
gcode:
  {% set pause_at_layer = printer["gcode_macro SET_PRINT_STATS_INFO"].pause_at_layer %}
  {% set enable = params.ENABLE|int != 0 if params.ENABLE is defined else params.LAYER is defined %}
  {% set layer = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set macro = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': enable, 'layer': layer, 'call': macro }}"

[gcode_macro SET_PRINT_STATS_INFO]
description: Preserve layer info and support pause-at-layer helpers
rename_existing: SET_PRINT_STATS_INFO_BASE
variable_pause_next_layer: { "enable": False, "call": "PAUSE" }
variable_pause_at_layer: { "enable": False, "layer": 0, "call": "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call}
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced at layer %d" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call}
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}

[gcode_macro ORCA_LAYER_CHANGE]
description: Layer info bridge for OrcaSlicer
gcode:
  {% set current_layer = params.LAYER|default(0)|int %}
  {% set total_layer = params.TOTAL|default(0)|int %}
  SET_PRINT_STATS_INFO CURRENT_LAYER={current_layer} TOTAL_LAYER={total_layer}

[gcode_macro MESH_QUICK]
description: Calibrate a 5x5 mesh and keep it active
gcode:
  _RUN_BED_MESH PROFILE={params.PROFILE|default("quick")} PROBE_COUNT=5,5 TEMP={params.TEMP|default(60)} SOAK={params.SOAK|default(60)}

[gcode_macro MESH_PRECISE]
description: Calibrate a 7x7 mesh and keep it active
gcode:
  _RUN_BED_MESH PROFILE={params.PROFILE|default("ultra")} PROBE_COUNT=7,7 TEMP={params.TEMP|default(60)} SOAK={params.SOAK|default(120)}

[gcode_macro _RUN_BED_MESH]
description: Heat, home and calibrate a bed mesh profile
gcode:
  {% set profile = params.PROFILE|default("ultra")|string %}
  {% set probe_count = params.PROBE_COUNT|default("7,7")|string %}
  {% set temp = params.TEMP|default(60)|float %}
  {% set soak = params.SOAK|default(120)|int %}
  _SET_STATUS_MESH
  M140 S{temp}
  M190 S{temp}
  {% if soak > 0 %}
    G4 P{soak * 1000}
  {% endif %}
  G28
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE PROFILE={profile} PROBE_COUNT={probe_count}
  RESPOND TYPE=echo MSG='{"Mesh \"%s\" complete at %.0fC. Run SAVE_CONFIG to persist it." % (profile, temp)}'

[gcode_macro LOAD_BED_MESH]
description: Load a saved mesh profile
gcode:
  _BED_MESH_START MODE=load PROFILE={params.PROFILE|default("ultra")} FALLBACK={params.FALLBACK|default("error")}

[gcode_macro COOLDOWN]
description: Turn off heaters and part cooling fan
gcode:
  TURN_OFF_HEATERS
  M106 S0
  _SET_STATUS_READY
